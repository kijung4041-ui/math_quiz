 d7=u=>w7.reduce((a,k)=>a+(ddOf(u)[k]||0),0),acc=u=>pc(u.correct,u.solved),cur=u=>u.sd==T||u.sd==days[12]?u.sn:0,
 spd=u=>{let n=0,t=0;const y=tyOf(u);for(const k in y){n+=y[k].n;t+=y[k].t}return n?(t/n/1000).toFixed(1):'-'},
