<style>
:root{--card:#fff;--ink:#35305a;--sub:#6e6890;--pri:#6a5ae0;--on:#fff;--line:#e4dcf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#fbf5ff,#e8f4ff) fixed;color:var(--ink);font:17px/1.55 'Noto Sans KR',system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.hero{font-size:56px;text-align:center;line-height:1.2}

<body><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
/* ▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값으로 교체 */
const cfg={apiKey:"AIzaSyBlhgDlqHh2zzyqwsyJ0WQGQXNIUttrtkc",authDomain:"math-quiz-bb8ad.firebaseapp.com",projectId:"math-quiz-bb8ad",appId:"1:631904496083:web:ba0846c537c7c824762726"};
const FB=cfg.apiKey!=="YOUR_API_KEY";let db=null,au=null;
if(FB){const app=initializeApp(cfg);au=getAuth(app);db=getFirestore(app)}
const A=document.getElementById('app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const R=h=>{A.innerHTML='<div class="w">'+h+'</div>';if(window.renderMathInElement)renderMathInElement(A,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})};
let name='',G=null,ERR='';
const M={time:{e:'⏱️',n:'타임어택',d:'180초 안에 최대한 많이! 랭킹 기록',time:180},free:{e:'♾️',n:'무한 연습',d:'시간 제한 없이 · 해설 확인'},chal:{e:'🔥',n:'챌린지',d:'10문제 연속 정답이면 레벨업'},boss:{e:'👾',n:'보스전',d:'어려운 문제 5개 · 목숨 3개'}};

/* 단원과 문제 파일(questions.xlsx) */
const UN=[{id:'p',sheet:'명제',n:'명제',e:'🧩',d:'집합과 명제'},{id:'f',sheet:'함수',n:'함수',e:'📈',d:'함수와 그래프'},{id:'r',sheet:'유리함수와무리함수',n:'유리함수·무리함수',e:'🌀',d:'유리함수와 무리함수'}];
let B=[],QS={},LOADERR='',UNIT='p';
async function loadQ(){try{const r=await fetch('questions.xlsx?v='+Date.now());if(!r.ok)throw 0;const wb=XLSX.read(await r.arrayBuffer());
 UN.forEach(u=>{QS[u.id]=[];const ws=wb.Sheets[u.sheet];if(!ws)return;
  XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(o=>{const t=String(o['유형']).trim(),q=String(o['문제']).trim(),a=String(o['정답']).trim(),ch=[1,2,3,4].map(i=>String(o['보기'+i]).trim()),ox=t=='ox',ans=ox?(a=='O'?0:a=='X'?1:-1):+a-1;
   if(!q||String(o['사용']).trim().toUpperCase()=='N'||(t!='mc4'&&!ox)||(ox?ans<0:(ch.some(c=>!c)||!(ans>=0&&ans<4))))return;
   QS[u.id].push([+o['난이도']||2,ox?'ox':'mc',q,ox?['O','X']:ch,ans,String(o['해설'])])})})}catch(e){LOADERR='문제 파일(questions.xlsx)을 불러오지 못했어요.'}}
function mk(d,t,q,ch,ans,ex){if(t!='ox'){const a=ch[ans];ch=shuf(ch);ans=ch.indexOf(a)}return{d,t,q,ch,ans,ex}}

/* 템플릿 1: 진리집합 (정답은 코드로 계산) */
const setS=a=>'{'+a.join(', ')+'}';
function tSet(){
 const N=rnd(8,15),div=Math.random()<.6,k=div?pick([6,8,9,10,12,14,15,18,20,24]):rnd(2,5),ok=[];
 for(let i=1;i<=N;i++)if(div?k%i==0:i%k==0)ok.push(i);
 const non=[];for(let i=1;i<=N;i++)if(!ok.includes(i))non.push(i);
 const e1=pick(non),e2=pick(non.filter(v=>v!=e1).concat([e1]));
 const srt=a=>[...new Set(a)].sort((x,y)=>x-y);
 let ds=[ok.slice(1),ok.slice(0,-1),srt(ok.concat(e1)),srt(ok.concat(e1,e2))];
 if(div&&k>N)ds.push(srt(ok.concat(k)));
 const key=setS(ok),seen=new Set([key]),w=[];
 shuf(ds).forEach(a=>{const s=setS(a);if(a.length&&!seen.has(s)){seen.add(s);w.push(s)}});
 if(w.length<3)return tSet();
 return mk(1,'mc',`전체집합 U={x | x는 ${N} 이하의 자연수}일 때, 조건 'x는 ${k}의 ${div?'약수':'배수'}이다.'의 진리집합은?`,[key,...w.slice(0,3)],0,`${k}의 ${div?'약수':'배수'} 중 ${N} 이하인 수만 U의 원소입니다.`)}

/* 템플릿 2: 충분·필요조건 (진리집합의 포함 관계로 계산) */
function tCond(){
 let q,r;
 if(Math.random()<.5){const a=rnd(-3,6),b=rnd(-3,6);q=`p: x>${a}, q: x>${b} (x는 실수)`;r=a==b?2:a>b?0:1}
 else{const L=[2,3,4,6,8,9,12],m=pick(L),n=pick(L);if(m==n)return tCond();q=`p: x는 ${m}의 배수, q: x는 ${n}의 배수 (x는 정수)`;r=m%n==0?0:n%m==0?1:3}
 return mk(2,'mc',`${q}일 때, p는 q이기 위한 무슨 조건인가?`,['충분조건','필요조건','필요충분조건','충분조건도 필요조건도 아니다'],r,'진리집합 P, Q의 포함 관계로 판단합니다. P⊂Q이면 충분, Q⊂P이면 필요, P=Q이면 필요충분조건입니다.')}

/* 템플릿 3: 모든/어떤 명제의 부정 */
function tNeg(){const all=Math.random()<.5,k=rnd(1,4),m=rnd(2,9),e=`x²−${2*k}x+${m}`,ng={'>':'≤','≥':'<','<':'≥','≤':'>'},fl={'>':'<','≥':'≤','<':'>','≤':'≥'},r=pick(['>','≥','<','≤']),
 s=(a,o)=>`${a?'모든':'어떤'} 실수 x에 대하여 ${e}${o}0이다`;
 return mk(2,'mc',`'${s(all,r)}.'의 부정은?`,[s(!all,ng[r]),s(!all,r),s(all,ng[r]),s(!all,fl[r])],0,`'모든'은 '어떤'으로, '어떤'은 '모든'으로 바꾸고 부등호를 부정합니다(>는 ≤, ≥는 <).`)}
/* 템플릿 4: 참인 명제의 대우 추론 */
function tLogic(){const[v,w]=Math.random()<.5?['p','q']:['q','p'],n=a=>a[0]=='~'?a.slice(1):'~'+a,X=Math.random()<.5?v:'~'+v,Y=Math.random()<.5?w:'~'+w,f=(a,b)=>a+' → '+b,c=f(n(Y),n(X));
 return mk(3,'mc',`명제 '${f(X,Y)}'가 참일 때, 항상 참인 명제는?`,[c,f(Y,X),f(n(X),n(Y)),f(X,n(Y))],0,`참인 명제의 대우는 항상 참입니다. '${f(X,Y)}'의 대우는 '${c}'입니다.`)}
/* 템플릿 5: 보기 조합형 */
function tComb(){const L=[2,3,4,6,8,9,12],g=[()=>{const a=pick(L),b=pick(L);return a==b?null:[`x가 ${a}의 배수이면 x는 ${b}의 배수이다`,a%b==0]},()=>{const s=rnd(2,6);return[`x²=${s*s}이면 x=${s}이다`,false]},()=>{const k=rnd(1,5);return[`x>${k}이면 x²>${k*k}이다`,true]},()=>{const k=rnd(1,5);return[`x²>${k*k}이면 x>${k}이다`,false]},()=>[`x가 ${pick([4,6,8,10])}의 배수이면 x는 짝수이다`,true]];
 let st;for(;;){st=shuf([0,1,2,3,4]).slice(0,3).map(i=>g[i]());const t=st.filter(a=>a&&a[1]).length;if(st.every(Boolean)&&t>0&&t<3)break}
 const lb=m=>[...m].map(i=>'ㄱㄴㄷ'[i]).join(', '),cs=[0,1,2].filter(i=>st[i][1]).join(''),o=shuf(['0','1','2','01','02','12','012'].filter(x=>x!=cs)).slice(0,3);
 return mk(3,'mc',`x가 정수일 때, 다음 <보기> 중 참인 명제만을 있는 대로 고른 것은?\nㄱ. ${st[0][0]}.\nㄴ. ${st[1][0]}.\nㄷ. ${st[2][0]}.`,[cs,...o].map(lb),0,`각 명제의 반례를 찾아 참·거짓을 확인합니다. 참인 것은 ${lb(cs)}입니다.`)}
tCond.h=tNeg.h=tLogic.h=tComb.h=1;
const TP={p:[tSet,tCond,tNeg,tLogic,tComb]};

function pickQ(){const m=G.mode,tp=TP[UNIT]||[];
 if(tp.length&&(!B.length||Math.random()<(m=='time'?.7:.5))){const pl=m=='boss'?tp.filter(f=>f.h):tp;let c=pl.filter(f=>!G.lt.includes(f));if(!c.length)c=pl;const f=pick(c);G.lt=[f,...G.lt].slice(0,2);return f()}
 const all=B.map((x,i)=>i).filter(i=>m!='boss'||B[i][0]>1);
 let p=all.filter(i=>!G.used.has(i));if(!p.length){G.used.clear();p=all.length?all:B.map((x,i)=>i)}
 const i=pick(p);G.used.add(i);return mk(...B[i])}

const em=id=>id+'@mj-student.example.com',pwd=p=>p+'mj',g=i=>document.getElementById(i);
const acts={
 async go(){const id=g('sid').value.trim(),pin=g('pin').value.trim(),er=g('er');
  if(!/^\d{5}$/.test(id)){er.textContent='학번은 숫자 5자리로 입력해 주세요.';return}
  if(!/^\d{4}$/.test(pin)){er.textContent='비밀번호는 숫자 4자리로 입력해 주세요.';return}
  if(!au){name=id;menu();return}
  er.textContent='입장 중…';
  try{await signInWithEmailAndPassword(au,em(id),pwd(pin))}
  catch(e){
   if(e.code=='auth/too-many-requests'){er.textContent='시도가 너무 많아요. 잠시 후 다시 해 주세요.';return}
   try{await createUserWithEmailAndPassword(au,em(id),pwd(pin))}
   catch(e2){er.textContent=e2.code=='auth/email-already-in-use'?'비밀번호가 달라요. 다시 확인해 주세요.':'입장에 실패했어요. 잠시 후 다시 시도해 주세요.';return}}
  name=id;menu()},
 async logout(){if(au)await signOut(au);name='';home()},
 home,menu,modes,rank,back(){name?menu():home()},unit(b){UNIT=b.dataset.v;modes()},ru(b){UNIT=b.dataset.v;rank()},
 start(b){start(b.dataset.v)},ans(b){ans(+b.dataset.v)},nx(){G.done?finish():next()},quit(){finish()}
};
A.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&acts[b.dataset.a])acts[b.dataset.a](b)};
A.oninput=e=>{if(e.target.matches('#sid,#pin'))e.target.value=e.target.value.replace(/\D/g,'')};

function home(){R(`<div class="hero">🦊</div><h1>수학 챌린지</h1><p class="sub">공통수학2 · 단원별 게임</p><div class="card"><label for="sid">학번 (숫자 5자리)</label><input id="sid" inputmode="numeric" maxlength="5" autocomplete="username" placeholder="예: 10215"><label for="pin" style="margin-top:14px">비밀번호 (숫자 4자리)</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••"><button class="b" data-a="go">🚀 입장하기</button><p id="er" class="s" style="margin:10px 0 0"></p><p class="s" style="font-size:13px;margin:6px 0 0">처음 입장하면 자동으로 가입돼요. 학번과 비밀번호는 이 게임 랭킹에만 쓰이고, 랭킹에는 학번이 표시됩니다.</p></div>`)}
function menu(){clearInterval(G&&G.iv);R(`<div class="hero">🦊</div><h1>${esc(name)} 님, 반가워요!</h1><p class="sub">${LOADERR||'공부할 단원을 골라 보세요'}</p><div class="grid">${UN.map(u=>{const n=(QS[u.id]||[]).length+(TP[u.id]?1:0);return `<button class="b m ${u.id}" data-a="unit" data-v="${u.id}"${n?'':' disabled'}><span class="em">${u.e}</span><span>${u.n}<small>${n?u.d:'준비 중'}</small></span></button>`}).join('')}</div><button class="b g" data-a="rank">🏆 랭킹 보기</button><button class="b g" data-a="logout">👋 로그아웃</button>`)}
function modes(){const u=UN.find(x=>x.id==UNIT);R(`<div class="hero">${u.e}</div><h1>${u.n}</h1><p class="sub">모드를 골라 보세요</p><div class="grid">${Object.entries(M).map(([k,m])=>`<button class="b m ${k}" data-a="start" data-v="${k}"><span class="em">${m.e}</span><span>${m.n}<small>${m.d}</small></span></button>`).join('')}</div><button class="b g" data-a="rank">🏆 랭킹 보기</button><button class="b g" data-a="menu">← 단원 선택</button>`)}

function start(mode){
 clearInterval(G&&G.iv);
 B=QS[UNIT]||[];G={lt:[],mode,score:0,streak:0,correct:0,total:0,lives:3,lv:1,used:new Set(),wrong:[],end:Date.now()+(M[mode].time||0)*1000};
 if(mode=='time')G.iv=setInterval(tick,250);
 next()}
function stat(){const m=G.mode;if(m=='time')return Math.max(0,Math.ceil((G.end-Date.now())/1000))+'초';
 if(m=='boss')return '❤️'.repeat(Math.max(0,G.lives))+` 클리어 ${G.correct}/5`;
 if(m=='chal')return `Lv.${G.lv} · ${G.streak}/10`;return `${G.correct}/${G.total}`}
function setPg(){const m=G.mode,e=document.getElementById('pg');if(!e)return;
 const p=m=='time'?(G.end-Date.now())/(M.time.time*10):m=='boss'?G.correct*20:m=='chal'?G.streak*10:0;e.style.width=Math.max(0,Math.min(100,p))+'%'}
function tick(){if(G.fin)return;const s=document.getElementById('st');if(s)s.textContent=stat();setPg();if(Date.now()>=G.end)finish()}
function next(){if(G.fin)return;G.q=pickQ();G.lock=false;G.done=false;const q=G.q;
 R(`<div class="bar"><span>${M[G.mode].e} ${M[G.mode].n}</span><span>점수 <b id="sc">${G.score}</b></span></div>
<div class="bar s"><span id="cb">${G.streak>1?'🔥 '+G.streak+'연속':''}</span><span id="st">${stat()}</span></div>
<div class="pg"><i id="pg"></i></div>
<div class="card"><div class="s">${['','쉬움','보통','어려움'][q.d]}</div><div style="font-size:19px;font-weight:700;white-space:pre-line">${esc(q.q)}</div></div>
${q.ch.map((c,i)=>`<button class="b g" data-a="ans" data-v="${i}">${q.t=='ox'?'':'①②③④'[i]+' '}${esc(c)}</button>`).join('')}
<div id="fb"></div><button class="b g" data-a="quit" style="margin-top:24px">그만하기</button>`);setPg()}
function ans(i){
 if(G.lock||G.fin)return;G.lock=true;const q=G.q,ok=i==q.ans,bs=A.querySelectorAll('[data-a=ans]');G.total++;
 bs[i].classList.add(ok?'ok':'bad');if(!ok)bs[q.ans].classList.add('ok');
 let msg=ok?'🎉 정답!':'🥲 오답 · 정답은 '+q.ch[q.ans];
 if(ok){G.correct++;G.streak++;G.score+=100+({3:50,5:100,10:300}[G.streak]||0)}
 else{G.streak=0;G.wrong.push(q);if(G.mode=='boss')G.lives--}
 if(G.mode=='chal'&&G.streak>=10){G.lv++;G.streak=0;msg='레벨 업! Lv.'+G.lv}
 const m=G.mode;G.done=(m=='boss'&&(G.correct>=5||G.lives<=0));
 document.getElementById('sc').textContent=G.score;
 document.getElementById('cb').innerHTML=G.streak>1?`<span class="pop">🔥 ${G.streak}연속</span>`:'';
 document.getElementById('st').textContent=stat();setPg();
 if(m=='time'){setTimeout(next,ok?350:900);document.getElementById('fb').innerHTML=`<p><b>${esc(msg)}</b></p>`}
 else document.getElementById('fb').innerHTML=`<div class="card"><b>${esc(msg)}</b><br><span class="s">${esc(q.ex)}</span></div><button class="b" data-a="nx">${G.done?'결과 보기':'다음 문제'}</button>`}
async function save(){
 const r={sid:name,unit:UNIT,score:G.score,n:G.correct,t:Date.now()},l=LS.g('mj_sc',[]);l.push(r);LS.s('mj_sc',l.slice(-200));
 let st='인증';try{if(db){await au.authStateReady();st='읽기';const ref=doc(db,'rank',UNIT+'_'+name),o=await getDoc(ref);st='쓰기';if(!o.exists()||o.data().score<r.score)await setDoc(ref,r);return true}}catch(e){ERR=st+' '+(e.code||String(e))}return false}
async function finish(){
 if(G.fin)return;G.fin=1;clearInterval(G.iv);let note='';
 if(G.mode=='time'&&G.total>0)note=(await save())?'랭킹에 기록했어요.':'이 기기에만 기록했어요. (오류: '+ERR+')';
 const win=G.mode=='boss'&&G.correct>=5;
 R(`<h1>${win?'🏆 ':'🎉 '}${G.mode=='boss'?(win?'보스 클리어!':'보스전 종료'):'결과'}</h1><div class="card"><div style="font-size:34px;font-weight:900">${G.score}점</div><div class="sub" style="margin:0">정답 ${G.correct} / ${G.total}${G.mode=='chal'?' · Lv.'+G.lv:''}</div>${note?`<p style="margin:8px 0 0">${note}</p>`:''}</div>${G.wrong.length?`<div class="card"><b>틀린 문제</b>${G.wrong.slice(0,8).map(q=>`<p>${esc(q.q)}<br><span class="s">정답: ${esc(q.ch[q.ans])} — ${esc(q.ex)}</span></p>`).join('')}</div>`:''}<button class="b" data-a="start" data-v="${G.mode}">다시 하기</button><button class="b g" data-a="rank">랭킹 보기</button><button class="b g" data-a="modes">모드 선택</button>`)}
async function rank(){
 clearInterval(G&&G.iv);R('<h1>🏆 랭킹</h1><p class="sub">불러오는 중…</p>');let rows=[],shared=false;
 try{if(db){const q=await getDocs(query(collection(db,'rank'),where('unit','==',UNIT)));rows=q.docs.map(d=>d.data());shared=true}}catch(e){ERR=e.code||String(e)}
 if(!shared)rows=LS.g('mj_sc',[]).filter(r=>r.unit==UNIT);
 const best={};rows.forEach(r=>{if(!best[r.sid]||r.score>best[r.sid].score)best[r.sid]=r});
 const all=Object.values(best).sort((a,b)=>b.score-a.score),top=all.slice(0,10),med=['🥇','🥈','🥉'],mi=all.findIndex(r=>r.sid==name);
 const row=(r,i)=>`<div class="card row${r.sid==name?' me':''}"><b>${med[i]||i+1}</b><span>${esc(r.sid)}</span><span>${r.score}점</span></div>`;
 R(`<h1>🏆 타임어택 랭킹</h1><div class="tabs">${UN.map(x=>`<button class="b ${x.id==UNIT?'':'g'} t" data-a="ru" data-v="${x.id}">${x.e} ${x.n}</button>`).join('')}</div><p class="sub" style="margin-top:12px">${shared?'상위 10명 · 학번별 최고 점수':'이 기기에서 한 기록만 표시됩니다 (오류: '+ERR+')'}</p>${top.length?top.map(row).join(''):'<div class="card">아직 기록이 없어요. 타임어택으로 첫 기록을 남겨 보세요 ✨</div>'}${mi>=10?'<p class="sub">내 순위</p>'+row(all[mi],mi):''}<button class="b g" data-a="menu">돌아가기</button>`)}

if(au)onAuthStateChanged(au,u=>{if(!u&&name){clearInterval(G&&G.iv);name='';home()}});
(async()=>{await loadQ();if(au){await au.authStateReady();const u=au.currentUser;if(u&&/^\d{5}@/.test(u.email||'')){name=u.email.split('@')[0];menu();return}}home()})();
