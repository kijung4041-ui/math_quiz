function units(){R(`<div class="hero">${M[MODE].e}</div><h1>${M[MODE].n}</h1><p class="sub">공부할 단원을 골라 보세요</p><div class="grid">${UN.map(u=>{const n=(QS[u.id]||[]).length+(TP[u.id]?1:0);return `<button class="b m ${u.id}" data-a="unit" data-v="${u.id}"${n?'':' disabled'}><span class="em">${u.e}</span><span>${u.n}<small>${n?u.d:'준비 중'}</small></span></button>`}).join('')}</div><button class="b g" data-a="menu">← 처음으로</button>`)}

function start(mode){
 clearInterval(G&&G.iv);
 B=QS[UNIT]||[];G={xp:0,wr:0,run:0,mr:0,f:0,h:new Date().getHours(),lt:[],mode,score:0,streak:0,correct:0,total:0,lives:3,lv:1,used:new Set(),wrong:[],end:Date.now()+(M[mode].time||0)*1000};
 if(mode=='time'||mode=='boss')G.iv=setInterval(tick,250);
 next()}
function stat(){const m=G.mode;if(m=='time')return Math.max(0,Math.ceil((G.end-Date.now())/1000))+'초';
 if(m=='boss')return Math.max(0,Math.ceil((G.qend-Date.now())/1000))+'초 · '+'❤️'.repeat(Math.max(0,G.lives))+` 클리어 ${G.correct}/5`;
 if(m=='chal')return `Lv.${G.lv} · ${G.streak}/10`;return `${G.correct}/${G.total}`}
function setPg(){const m=G.mode,e=document.getElementById('pg');if(!e)return;
 const p=m=='time'?(G.end-Date.now())/(M.time.time*10):m=='boss'?(G.qend-Date.now())/(G.qt*10):m=='chal'?G.streak*10:0;e.style.width=Math.max(0,Math.min(100,p))+'%'}
function tick(){if(G.fin)return;const s=document.getElementById('st');if(s)s.textContent=stat();setPg();if(G.mode=='time'&&Date.now()>=G.end)finish();if(G.mode=='boss'&&!G.lock&&Date.now()>=G.qend)ans(-1)}
function next(){if(G.fin)return;G.q=pickQ();G.lock=false;G.done=false;const q=G.q;G.qs=Date.now();if(G.mode=='boss'){G.qt=q.d==3?50:30;G.qend=Date.now()+G.qt*1000}
 R(`<div class="bar"><span>${M[G.mode].e} ${M[G.mode].n}</span><span>점수 <b id="sc">${G.score}</b></span></div>
<div class="bar s"><span id="cb">${G.streak>1?'🔥 '+G.streak+'연속':''}</span><span id="st">${stat()}</span></div>
<div class="pg"><i id="pg"></i></div>
<div class="card"><div class="s">${['','쉬움','보통','어려움'][q.d]}${location.hash=='#debug'?' · '+(q.tn||'엑셀'):''}</div><div style="font-size:19px;font-weight:700;white-space:pre-line">${esc(q.q)}</div></div>
${q.ch.map((c,i)=>`<button class="b g" data-a="ans" data-v="${i}">${q.t=='ox'?'':'①②③④'[i]+' '}${esc(c)}</button>`).join('')}
<div id="fb"></div><button class="b g" data-a="quit" style="margin-top:24px">그만하기</button>`);setPg()}
function ans(i){
 if(G.lock||G.fin)return;G.lock=true;const q=G.q,ok=i==q.ans,bs=A.querySelectorAll('[data-a=ans]');G.total++;
 if(bs[i])bs[i].classList.add(ok?'ok':'bad');if(!ok)bs[q.ans].classList.add('ok');
 let msg=ok?'🎉 '+pick(['훌륭해요!','좋아요!','잘했어요!','완벽해요!']):(i<0?'⏰ 시간 초과! ':'🥲 '+pick(['괜찮아요, 다음엔 맞힐 수 있어요!','아쉬워요, 정답을 확인해요!','실수는 성장의 지름길!'])+' ')+'정답은 '+q.ch[q.ans];
 track(ok,q);if(ok){G.correct++;G.streak++;G.score+=100+({3:50,5:100,10:300}[G.streak]||0)}
 else{G.streak=0;G.wrong.push(q);if(G.mode=='boss')G.lives--}
 if(G.mode=='chal'&&G.streak>=10){G.lv++;G.streak=0;msg='레벨 업! Lv.'+G.lv}
 const m=G.mode;G.done=(m=='boss'&&(G.correct>=5||G.lives<=0));
 if(ok){burst(bs[i]);snd('ok');if([3,5,10].includes(G.streak))flame(G.streak)}else snd('bad');
 document.getElementById('sc').textContent=G.score;
 document.getElementById('cb').innerHTML=G.streak>1?`<span class="pop">🔥 ${G.streak}연속</span>`:'';
 document.getElementById('st').textContent=stat();setPg();
 if(m=='time'){setTimeout(next,ok?350:900);document.getElementById('fb').innerHTML=`<p><b>${esc(msg)}</b></p>`}
 else document.getElementById('fb').innerHTML=`<div class="card"><b>${esc(msg)}</b><br><span class="s">${esc(q.ex)}</span></div><button class="b" data-a="nx">${G.done?'결과 보기':'다음 문제'}</button>`}
async function save(){
 const r={sid:name,unit:UNIT,score:G.score,n:G.correct,t:Date.now()},l=LS.g('mj_sc',[]);l.push(r);LS.s('mj_sc',l.slice(-200));
 let st='인증';try{if(db){await au.authStateReady();st='읽기';const ref=doc(db,'rank',UNIT+'_'+name),o=await getDoc(ref);st='쓰기';if(!o.exists()||o.data().score<r.score)await setDoc(ref,r);return true}}catch(e){ERR=st+' '+(e.code||String(e))}return false}
async function finish(){
 if(G.fin)return;G.fin=1;clearInterval(G.iv);let note='';
 if(G.mode=='time'&&G.total>0)note=(await save())?'랭킹에 기록했어요.':'이 기기에만 기록했어요. (오류: '+ERR+')';
 const win=G.mode=='boss'&&G.correct>=5,nw=applyGame(),prog=`<div class="card">⭐ +${G.xp} XP · Lv.${lv(UD.xp)} · ${UD.dayN>=5?'🔥 오늘 스트릭 달성!':'오늘 '+UD.dayN+'/5문제'}${nw.map(a=>`<br>🏅 새 업적! ${a[1]} <b>${a[2]}</b>`).join('')}</div>`;
 R(`<h1>${win?'🏆 ':'🎉 '}${G.mode=='boss'?(win?'보스 클리어!':'보스전 종료'):'결과'}</h1><div class="card"><div style="font-size:34px;font-weight:900">${G.score}점</div><div class="sub" style="margin:0">정답 ${G.correct} / ${G.total}${G.mode=='chal'?' · Lv.'+G.lv:''}</div>${note?`<p style="margin:8px 0 0">${note}</p>`:''}</div>${prog}${G.wrong.length?`<div class="card"><b>틀린 문제</b>${G.wrong.slice(0,8).map(q=>`<p>${esc(q.q)}<br><span class="s">정답: ${esc(q.ch[q.ans])} — ${esc(q.ex)}</span></p>`).join('')}</div>`:''}<button class="b" data-a="start" data-v="${G.mode}">다시 하기</button><button class="b g" data-a="rank">랭킹 보기</button><button class="b g" data-a="menu">처음으로</button>`)}
async function rank(){
 clearInterval(G&&G.iv);R('<h1>🏆 랭킹</h1><p class="sub">불러오는 중…</p>');let rows=[],shared=false;
 try{if(db){const q=await getDocs(query(collection(db,'rank'),where('unit','==',UNIT)));rows=q.docs.map(d=>d.data());shared=true}}catch(e){ERR=e.code||String(e)}
 if(!shared)rows=LS.g('mj_sc',[]).filter(r=>r.unit==UNIT);
 const best={};rows.forEach(r=>{if(!best[r.sid]||r.score>best[r.sid].score)best[r.sid]=r});
 const all=Object.values(best).sort((a,b)=>b.score-a.score),top=all.slice(0,10),med=['🥇','🥈','🥉'],mi=all.findIndex(r=>r.sid==name);if(mi>=0&&mi<10&&UD&&!UD.ach.rank){UD.ach.rank=today();saveU()}
 const row=(r,i)=>`<div class="card row${r.sid==name?' me':''}"><b>${med[i]||i+1}</b><span>${esc(r.sid)}</span><span>${r.score}점</span></div>`;
 R(`<h1>🏆 타임어택 랭킹</h1><div class="tabs">${UN.map(x=>`<button class="b ${x.id==UNIT?'':'g'} t" data-a="ru" data-v="${x.id}">${x.e} ${x.n}</button>`).join('')}</div><p class="sub" style="margin-top:12px">${shared?'상위 10명 · 학번별 최고 점수':'이 기기에서 한 기록만 표시됩니다 (오류: '+ERR+')'}</p>${top.length?top.map(row).join(''):'<div class="card">아직 기록이 없어요. 타임어택으로 첫 기록을 남겨 보세요 ✨</div>'}${mi>=10?'<p class="sub">내 순위</p>'+row(all[mi],mi):''}<button class="b g" data-a="menu">돌아가기</button>`)}

if(au)onAuthStateChanged(au,u=>{if(!u&&name){clearInterval(G&&G.iv);name='';home()}});
(async()=>{await loadQ();if(au){await au.authStateReady();const u=au.currentUser;if(u&&/^\d{5}@/.test(u.email||'')){name=u.email.split('@')[0];await loadU();menu();return}}home()})();
</script></body></html>
