 return mk(3,'mc',`함수 f(x)=ax+b (a≠1)가 f=f⁻¹를 만족시키고 f(${c})=${d}일 때, a+b의 값은? (단, a, b는 상수)`,fill(MN(v),[MN(c+d+1),MN(c-d-1),MN(c+d)],ng(v)),0,
  `f=f⁻¹이면 (f∘f)(x)=x입니다. f(f(x))=a²x+ab+b=x에서 a²=1, ab+b=0이고 a≠1이므로 a=−1입니다. f(${c})=${d}에서 −${c}+b=${d}이므로 b=${c+d}, a+b=${MN(v)}입니다.`)}
tfSelf.h=tfSelf.d3=1;

/* 함수 20: 그래프가 지나는 점과 역함수 */
function tfSym(){
 const a=rnd(-5,5),b=rnd(-5,5);if(a==b||(a==0&&b==0))return tfSym();
 const P=(x,y)=>`(${MN(x)}, ${MN(y)})`,t=rnd(0,1);
 return mk(1,'mc',t==0?`함수 f의 역함수 f⁻¹가 존재하고 y=f(x)의 그래프가 점 ${P(a,b)}를 지날 때, y=f⁻¹(x)의 그래프가 반드시 지나는 점은?`:
  `함수 f의 역함수 f⁻¹가 존재하고 f⁻¹(${MN(a)})=${MN(b)}일 때, y=f(x)의 그래프가 반드시 지나는 점은?`,
  t==0?fill(P(b,a),[P(a,b),P(-a,-b),P(-b,a),P(b,-a)],k=>P(b+k,a)):fill(P(b,a),[P(a,b),P(-b,-a),P(-b,a),P(b,-a)],k=>P(b,a+k)),0,
  t==0?`f(${MN(a)})=${MN(b)}이므로 f⁻¹(${MN(b)})=${MN(a)}입니다. 따라서 y=f⁻¹(x)의 그래프는 점 ${P(b,a)}를 지나요. (x좌표와 y좌표를 서로 바꾼 점)`:
  `f⁻¹(${MN(a)})=${MN(b)}이면 f(${MN(b)})=${MN(a)}이므로 y=f(x)의 그래프는 점 ${P(b,a)}를 지납니다.`)}

/* 함수 21: 함수와 그 역함수의 그래프의 교점 */
function tfSym2(){
 const a=pick([2,3,4,-2,-3]),t=pick([-4,-3,-2,-1,1,2,3,4,5]),b=t*(1-a),P=(x,y)=>`(${MN(x)}, ${MN(y)})`;
 return mk(3,'mc',`함수 f(x)=${lin(a,b)}의 그래프와 그 역함수 y=f⁻¹(x)의 그래프가 만나는 점의 좌표는?`,
  fill(P(t,t),[P(-t,-t),P(t,0),P(0,t),P(b,b)],k=>P(t+k,t+k)),0,
  `두 그래프는 직선 y=x에 대하여 대칭이므로 교점은 y=x 위에 있습니다. ${lin(a,b)}=x에서 x=${MN(t)}이므로 교점은 ${P(t,t)}입니다.`)}
tfSym2.h=tfSym2.d3=1;

function start(mode){
 clearInterval(G&&G.iv);
 B=QS[UNIT]||[];G={xp:0,wr:0,run:0,mr:0,f:0,h:new Date().getHours(),lt:[],mode,score:0,streak:0,correct:0,total:0,lives:3,lv:1,used:new Set(),wrong:[],end:Date.now()+(M[mode].time||0)*1000};
 if(mode=='time'||mode=='boss')G.iv=setInterval(tick,250);
 next()}
function stat(){const m=G.mode;if(m=='time')return Math.max(0,Math.ceil((G.end-Date.now())/1000))+'초';
 if(m=='boss')return Math.max(0,Math.ceil((G.qend-Date.now())/1000))+'초 · '+'❤️'.repeat(Math.max(0,G.lives))+` 클리어 ${G.correct}/5`;
 if(m=='chal')return `Lv.${G.lv} · ${G.streak}/10`;return `${G.correct}/${G.total}`}
function setPg(){const m=G.mode,e=document.getElementById('pg');if(!e)return;
 const p=m=='time'?(G.end-Date.now())/(M.time.time*10):m=='boss'?(G.qend-Date.now())/(G.qt*10):m=='chal'?G.streak*10:0;e.style.width=Math.max(0,Math.min(100,p))+'%'}
function tick(){if(G.fin)return;const s=document.getElementById('st');if(s)s.textContent=stat();setPg();if(G.mode=='time'&&Date.now()>=G.end)finish();if(G.mode=='boss'&&!G.lock&&Date.now()>=G.qend)ans(-1)}
function next(){if(G.fin)return;G.q=pickQ();G.lock=false;G.done=false;const q=G.q;G.qs=Date.now();if(G.mode=='boss'){G.qt=q.d==3?50:30;G.qend=Date.now()+G.qt*1000}
 R(`<div class="bar"><span>${M[G.mode].e} ${M[G.mode].n}</span><span>점수 <b id="sc">${G.score}</b></span></div>
<div class="bar s"><span id="cb">${G.streak>1?'🔥 '+G.streak+'연속':''}</span><span id="st">${stat()}</span></div>
<div class="pg"><i id="pg"></i></div>
<div class="card"><div class="s">${['','쉬움','보통','어려움'][q.d]}${location.hash=='#debug'?' · '+(q.tn||'엑셀'):''}</div><div class="qq" style="font-size:19px;font-weight:700;white-space:pre-line">${fmt(q.q)}</div></div>
${(dg=>(dg?'<div class="dgrid">':'')+q.ch.map((c,i)=>`<button class="b g${dg?' dc':''}" data-a="ans" data-v="${i}">${q.t=='ox'?'':dg?`<span class="cn">${'①②③④'[i]}</span>`:'①②③④'[i]+' '}${fmt(c)}</button>`).join('')+(dg?'</div>':''))(q.ch.some(hasDg))}
<div id="fb"></div><button class="b g" data-a="quit" style="margin-top:24px">그만하기</button>`);setPg()}
function ans(i){
 if(G.lock||G.fin)return;G.lock=true;const q=G.q,ok=i==q.ans,bs=A.querySelectorAll('[data-a=ans]');G.total++;
 if(bs[i])bs[i].classList.add(ok?'ok':'bad');if(!ok)bs[q.ans].classList.add('ok');
 let msg=ok?'🎉 '+pick(['훌륭해요!','좋아요!','잘했어요!','완벽해요!']):(i<0?'⏰ 시간 초과! ':'🥲 '+pick(['괜찮아요, 다음엔 맞힐 수 있어요!','아쉬워요, 정답을 확인해요!','실수는 성장의 지름길!'])+' ')+'정답은 '+(hasDg(q.ch[q.ans])?'①②③④'[q.ans]+'번':q.ch[q.ans])+(!ok&&G.mode=='time'&&G.score>0?' · −'+Math.min(G.score,150)+'점':'');
 track(ok,q);if(ok){G.correct++;G.streak++;G.score+=500+({3:250,5:500,10:1500}[G.streak]||0)}
 else{G.streak=0;G.wrong.push(q);if(G.mode=='boss')G.lives--;if(G.mode=='time'){const l=Math.min(G.score,150);G.score-=l;if(l)minus(l)}}
 if(G.mode=='chal'&&G.streak>=10){G.lv++;G.streak=0;msg='레벨 업! Lv.'+G.lv}
 const m=G.mode;G.done=(m=='boss'&&(G.correct>=5||G.lives<=0));
 if(ok){burst(bs[i]);snd('ok');if([3,5,10].includes(G.streak))flame(G.streak)}else snd('bad');
 document.getElementById('sc').textContent=G.score;
 document.getElementById('cb').innerHTML=G.streak>1?`<span class="pop">🔥 ${G.streak}연속</span>`:'';
 document.getElementById('st').textContent=stat();setPg();
 if(m=='time'){setTimeout(next,ok?350:3000);document.getElementById('fb').innerHTML=ok?`<p><b>${esc(msg)}</b></p>`:`<div class="card"><b>${esc(msg)}</b><br><span class="s">${fmt(q.ex)}</span><div class="pg" style="margin-top:10px"><i id="wb" style="width:100%;transition:width 3s linear;background:#ef6a6a"></i></div></div>`;if(!ok)setTimeout(()=>{const w=document.getElementById('wb');if(w)w.style.width='0'},30)}
 else document.getElementById('fb').innerHTML=`<div class="card"><b>${esc(msg)}</b><br><span class="s">${fmt(q.ex)}</span></div><button class="b" data-a="nx">${G.done?'결과 보기':'다음 문제'}</button>`}
async function save(){

 R(`<h1>${win?'🏆 ':'🎉 '}${G.mode=='boss'?(win?'보스 클리어!':'보스전 종료'):'결과'}</h1><div class="card"><div style="font-size:34px;font-weight:900">${G.score}점</div><div class="sub" style="margin:0">정답 ${G.correct} / ${G.total}${G.mode=='chal'?' · Lv.'+G.lv:''}</div>${note?`<p style="margin:8px 0 0">${note}</p>`:''}</div>${prog}${G.wrong.length?`<div class="card"><b>틀린 문제</b>${G.wrong.slice(0,8).map(q=>`<p class="qq" style="white-space:pre-line">${fmt(q.q)}<br><span class="s">정답: ${hasDg(q.ch[q.ans])?'①②③④'[q.ans]+'번 — ':fmt(q.ch[q.ans])+' — '}${fmt(q.ex)}</span></p>`).join('')}</div>`:''}<button class="b" data-a="start" data-v="${G.mode}">다시 하기</button><button class="b g" data-a="rank">랭킹 보기</button><button class="b g" data-a="menu">처음으로</button>`)}
async function rank(){
 clearInterval(G&&G.iv);R('<h1>🏆 랭킹</h1><p class="sub">불러오는 중…</p>');let rows=[],shared=false;
 try{if(db){const q=await getDocs(query(collection(db,'rank'),where('unit','==',UNIT)));rows=q.docs.map(d=>d.data());shared=true}}catch(e){ERR=e.code||String(e)}

 const all=Object.values(best).sort((a,b)=>b.score-a.score),top=all.slice(0,10),med=['🥇','🥈','🥉'],mi=all.findIndex(r=>r.sid==name);if(mi>=0&&mi<10&&UD&&!UD.ach.rank){UD.ach.rank=today();UD.cn.c=(UD.cn.c||0)+ACC.rank;saveU();toast('🏅 랭커 업적! +'+ACC.rank+'코인')}
 const row=(r,i)=>`<div class="card row${r.sid==name?' me':''}"><b>${med[i]||i+1}</b><span>${esc(r.sid)}</span><span>${r.score}점</span></div>`;
